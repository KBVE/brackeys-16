name: Release to itch.io

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  GODOT_VERSION: 4.7.1
  PROJECT_PATH: godot
  WEB_PATH: vite
  ITCH_USER: kbve
  ITCH_GAME: brackeys-16
  DEV_BRANCH: dev

jobs:
  check:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      next: ${{ steps.read.outputs.next }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        id: read
        with:
          script: |
            const fs = require('fs')
            const file = `${process.env.PROJECT_PATH}/project.godot`
            const match = fs.readFileSync(file, 'utf8').match(/^config\/version="(.*)"$/m)
            if (!match) {
              core.setFailed(`config/version missing from ${file}`)
              return
            }
            const version = match[1]
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              core.setFailed(`config/version "${version}" is not a bare x.y.z semver`)
              return
            }
            const [major, minor, patch] = version.split('.').map(Number)
            core.setOutput('version', version)
            core.setOutput('next', `${major}.${minor}.${patch + 1}`)
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/v${version}`,
              })
              core.notice(`v${version} already published - skipping.`)
              core.setOutput('publish', 'false')
            } catch (error) {
              if (error.status !== 404) throw error
              core.setOutput('publish', 'true')
            }

  test:
    name: Run gdUnit4 suite
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Pointers only. The blobs live on Forgejo, which this action cannot
          # authenticate against, and smudging here would 401 mid-checkout.
          lfs: false

      # 113 pointers resolve to 260MB off a self-hosted Forgejo box, and four jobs
      # in this repo each want the same bytes. Keyed on the pointer files, so it
      # only misses when the art actually changes.
      - name: Cache LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.gitattributes', 'godot/assets/characters/**') }}

      - name: Pull LFS assets (Forgejo)
        env:
          FORGEJO_USER: ${{ secrets.FORGEJO_USER }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          command -v git-lfs >/dev/null 2>&1 || sudo apt-get install -y -qq git-lfs
          git lfs install --local
          # Listed into a file rather than piped: `ls-files | grep -q` exits on
          # first match, git-lfs takes SIGPIPE part way through, and pipefail
          # reports that as "nothing tracked" for a repo that has plenty.
          git lfs ls-files -n > /tmp/lfs-files.txt
          if [ ! -s /tmp/lfs-files.txt ]; then
            echo "::notice::No LFS-tracked files - skipping"
            exit 0
          fi
          if [ -z "${FORGEJO_USER:-}" ] || [ -z "${FORGEJO_TOKEN:-}" ]; then
            echo "::error::FORGEJO_USER / FORGEJO_TOKEN missing. Godot imports an"
            echo "::error::unsmudged .glb as ERR_FILE_CORRUPT and dies on a signal,"
            echo "::error::so this fails here where the reason is still legible."
            exit 1
          fi
          printf 'machine git.kbve.com\nlogin %s\npassword %s\n' \
            "$FORGEJO_USER" "$FORGEJO_TOKEN" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          git lfs pull
          STUBS=$(xargs -r grep -l "^version https://git-lfs" < /tmp/lfs-files.txt 2>/dev/null || true)
          if [ -n "$STUBS" ]; then
            echo "::error::LFS pointers unresolved after pull:"
            printf '%s\n' "$STUBS" | head -5
            exit 1
          fi

      # Importing the characters is ~100s of CPU that produces byte-identical
      # output until an asset or its .import settings change. Measured cold: 2.8s
      # for this project without them, 47.2s with, on a machine with more cores
      # than a runner has.
      #
      # Only .godot/imported is cached. The uid and script-class caches next to it
      # are derived from scripts rather than assets, they rebuild in the 2.8s the
      # baseline already costs, and a stale one of those is a debugging afternoon.
      - name: Cache Godot imports
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: godot/.godot/imported
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('godot/assets/**', 'godot/**/*.import') }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Import assets
        run: godot --headless --path "${PROJECT_PATH}" --import

      - name: Run tests
        run: |
          godot --headless --path "${PROJECT_PATH}" \
            -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode -a res://tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gdunit4-report
          path: ${{ env.PROJECT_PATH }}/reports
          retention-days: 7

  publish:
    name: Build web + publish v${{ needs.check.outputs.version }}
    needs: [check, test]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Pointers only. The blobs live on Forgejo, which this action cannot
          # authenticate against, and smudging here would 401 mid-checkout.
          lfs: false

      # 113 pointers resolve to 260MB off a self-hosted Forgejo box, and four jobs
      # in this repo each want the same bytes. Keyed on the pointer files, so it
      # only misses when the art actually changes.
      - name: Cache LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.gitattributes', 'godot/assets/characters/**') }}

      - name: Pull LFS assets (Forgejo)
        env:
          FORGEJO_USER: ${{ secrets.FORGEJO_USER }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          command -v git-lfs >/dev/null 2>&1 || sudo apt-get install -y -qq git-lfs
          git lfs install --local
          # Listed into a file rather than piped: `ls-files | grep -q` exits on
          # first match, git-lfs takes SIGPIPE part way through, and pipefail
          # reports that as "nothing tracked" for a repo that has plenty.
          git lfs ls-files -n > /tmp/lfs-files.txt
          if [ ! -s /tmp/lfs-files.txt ]; then
            echo "::notice::No LFS-tracked files - skipping"
            exit 0
          fi
          if [ -z "${FORGEJO_USER:-}" ] || [ -z "${FORGEJO_TOKEN:-}" ]; then
            echo "::error::FORGEJO_USER / FORGEJO_TOKEN missing. Godot imports an"
            echo "::error::unsmudged .glb as ERR_FILE_CORRUPT and dies on a signal,"
            echo "::error::so this fails here where the reason is still legible."
            exit 1
          fi
          printf 'machine git.kbve.com\nlogin %s\npassword %s\n' \
            "$FORGEJO_USER" "$FORGEJO_TOKEN" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          git lfs pull
          STUBS=$(xargs -r grep -l "^version https://git-lfs" < /tmp/lfs-files.txt 2>/dev/null || true)
          if [ -n "$STUBS" ]; then
            echo "::error::LFS pointers unresolved after pull:"
            printf '%s\n' "$STUBS" | head -5
            exit 1
          fi

      # Importing the characters is ~100s of CPU that produces byte-identical
      # output until an asset or its .import settings change. Measured cold: 2.8s
      # for this project without them, 47.2s with, on a machine with more cores
      # than a runner has.
      #
      # Only .godot/imported is cached. The uid and script-class caches next to it
      # are derived from scripts rather than assets, they rebuild in the 2.8s the
      # baseline already costs, and a stale one of those is a debugging afternoon.
      - name: Cache Godot imports
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: godot/.godot/imported
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('godot/assets/**', 'godot/**/*.import') }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.WEB_PATH }}/package-lock.json

      - name: Install web dependencies
        working-directory: ${{ env.WEB_PATH }}
        run: npm ci

      - name: Export Godot into the web app
        working-directory: ${{ env.WEB_PATH }}
        run: npm run build:godot

      - name: Build web bundle
        working-directory: ${{ env.WEB_PATH }}
        run: |
          npm run build
          ls -lh dist dist/godot

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API }}
        run: |
          if [ -z "${BUTLER_API_KEY}" ]; then
            echo "::error::ITCH_API resolved empty - check the KBVE org secret's repository visibility."
            exit 1
          fi
          ./butler push "${WEB_PATH}/dist" "${ITCH_USER}/${ITCH_GAME}:html5" --userversion "${VERSION}"

      - name: Zip web build
        run: (cd "${WEB_PATH}/dist" && zip -qr "${GITHUB_WORKSPACE}/web.zip" .)

      - name: Tag and cut GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: web.zip

  sync:
    name: Sync dev with main
    needs: [check, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.UNITY_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const branch = process.env.DEV_BRANCH
            const params = { owner: context.repo.owner, repo: context.repo.repo }
            try {
              await github.rest.git.getRef({ ...params, ref: `heads/${branch}` })
            } catch (error) {
              if (error.status !== 404) throw error
              await github.rest.git.createRef({ ...params, ref: `refs/heads/${branch}`, sha: context.sha })
              core.notice(`Created ${branch} at ${context.sha}.`)
              return
            }
            try {
              await github.rest.git.updateRef({ ...params, ref: `heads/${branch}`, sha: context.sha, force: false })
              core.notice(`Fast-forwarded ${branch} to ${context.sha}.`)
            } catch (error) {
              if (error.status !== 422) throw error
              core.warning(`${branch} has diverged from main - opening a sync PR instead of moving the ref.`)
              const open = await github.rest.pulls.list({
                ...params, base: branch, head: `${params.owner}:main`, state: 'open',
              })
              if (open.data.length > 0) {
                core.notice(`Sync PR #${open.data[0].number} is already open.`)
                return
              }
              const created = await github.rest.pulls.create({
                ...params,
                base: branch,
                head: 'main',
                title: `chore: sync ${branch} with main`,
                body: `\`${branch}\` has commits that are not on main, so it could not be fast-forwarded after v${process.env.VERSION} shipped. Merge this to bring it back in line.`,
              })
              core.notice(`Opened sync PR #${created.data.number}.`)
            }

  bump:
    name: Open bump PR
    needs: [check, publish, sync]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.DEV_BRANCH }}

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          NEXT: ${{ needs.check.outputs.next }}
        with:
          script: |
            const fs = require('fs')
            const file = `${process.env.PROJECT_PATH}/project.godot`
            const source = fs.readFileSync(file, 'utf8')
            const current = source.match(/^config\/version="(.*)"$/m)
            if (!current) {
              core.setFailed(
                `config/version is missing from ${file} on ${process.env.DEV_BRANCH}. ` +
                `The sync job could not fast-forward that branch - merge the open sync PR first.`
              )
              return
            }
            if (current[1] === process.env.NEXT) {
              core.notice(`${process.env.DEV_BRANCH} is already at ${process.env.NEXT} - nothing to bump.`)
              return
            }
            fs.writeFileSync(file, source.replace(/^config\/version=".*"$/m, `config/version="${process.env.NEXT}"`))

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.UNITY_PAT || secrets.GITHUB_TOKEN }}
          base: ${{ env.DEV_BRANCH }}
          branch: chore/bump-${{ needs.check.outputs.next }}
          delete-branch: true
          commit-message: "chore: bump version to ${{ needs.check.outputs.next }}"
          title: "chore: bump version to ${{ needs.check.outputs.next }}"
          body: |
            v${{ needs.check.outputs.version }} is live on itch.

            Bumps `config/version` to `${{ needs.check.outputs.next }}` for the next build.

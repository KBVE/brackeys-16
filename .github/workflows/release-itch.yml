name: Release to itch.io

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  GODOT_VERSION: 4.7.1
  PROJECT_PATH: godot
  ITCH_USER: kbve
  ITCH_GAME: brackeys-16
  DEV_BRANCH: dev

jobs:
  check:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      next: ${{ steps.read.outputs.next }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        id: read
        with:
          script: |
            const fs = require('fs')
            const file = `${process.env.PROJECT_PATH}/project.godot`
            const match = fs.readFileSync(file, 'utf8').match(/^config\/version="(.*)"$/m)
            if (!match) {
              core.setFailed(`config/version missing from ${file}`)
              return
            }
            const version = match[1]
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              core.setFailed(`config/version "${version}" is not a bare x.y.z semver`)
              return
            }
            const [major, minor, patch] = version.split('.').map(Number)
            core.setOutput('version', version)
            core.setOutput('next', `${major}.${minor}.${patch + 1}`)
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/v${version}`,
              })
              core.notice(`v${version} already published - skipping.`)
              core.setOutput('publish', 'false')
            } catch (error) {
              if (error.status !== 404) throw error
              core.setOutput('publish', 'true')
            }

  publish:
    name: Build web + publish v${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import assets
        working-directory: ${{ env.PROJECT_PATH }}
        run: godot --headless --import

      - name: Export web build
        run: |
          mkdir -p build/web
          out="$(realpath build/web)"
          cd "${PROJECT_PATH}"
          godot --headless --export-release "Web" "${out}/index.html"
          ls -lh "${out}"

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API }}
        run: |
          if [ -z "${BUTLER_API_KEY}" ]; then
            echo "::error::ITCH_API resolved empty - check the KBVE org secret's repository visibility."
            exit 1
          fi
          ./butler push build/web "${ITCH_USER}/${ITCH_GAME}:html5" --userversion "${VERSION}"

      - name: Zip web build
        run: (cd build/web && zip -qr ../../web.zip .)

      - name: Tag and cut GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: web.zip

  bump:
    name: Open bump PR
    needs: [check, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const branch = process.env.DEV_BRANCH
            const params = { owner: context.repo.owner, repo: context.repo.repo }
            try {
              await github.rest.git.getRef({ ...params, ref: `heads/${branch}` })
            } catch (error) {
              if (error.status !== 404) throw error
              await github.rest.git.createRef({ ...params, ref: `refs/heads/${branch}`, sha: context.sha })
              core.notice(`Created ${branch} from ${context.sha}.`)
            }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.DEV_BRANCH }}

      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          NEXT: ${{ needs.check.outputs.next }}
        with:
          script: |
            const fs = require('fs')
            const file = `${process.env.PROJECT_PATH}/project.godot`
            const source = fs.readFileSync(file, 'utf8')
            const updated = source.replace(/^config\/version=".*"$/m, `config/version="${process.env.NEXT}"`)
            if (updated === source) {
              core.notice(`${process.env.DEV_BRANCH} is already at ${process.env.NEXT} - nothing to bump.`)
              return
            }
            fs.writeFileSync(file, updated)

      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          token: ${{ secrets.UNITY_PAT || secrets.GITHUB_TOKEN }}
          base: ${{ env.DEV_BRANCH }}
          branch: chore/bump-${{ needs.check.outputs.next }}
          delete-branch: true
          commit-message: "chore: bump version to ${{ needs.check.outputs.next }}"
          title: "chore: bump version to ${{ needs.check.outputs.next }}"
          body: |
            v${{ needs.check.outputs.version }} is live on itch.

            Bumps `config/version` to `${{ needs.check.outputs.next }}` for the next build.

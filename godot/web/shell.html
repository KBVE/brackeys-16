ate:{board:`click the photograph to board`,quiet:`The wire is quiet.`}},locations:[{id:`cabin`,name:`The Sleeping Cabins`,carriage:3,lede:`Berths one to eight, each with a door that locks from inside and a key that opens it from without.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`A folding basin, a reading lamp, and a mirror mounted where it catches the corridor whenever the door stands open.`],bullets:[]},the_keys:{heading:`The Keys`,paragraphs:[`The conductor holds a pass key and says he has not used it. There is a second pass key, and no ledger records who signed for it.`],bullets:[]}},source:`shared/data/locations/cabin.mdx`},{id:`corridor`,name:`The Corridor`,carriage:2,lede:`Feels about a yard wide, just enough room to avoid a leg cramp but it is a full length of the train. And the only way from any berth to any other.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Windows down one side, doors down the other, and a runner of carpet that shows every step taken on it while the rain was falling.`],bullets:[]},why_it_matters:{heading:`Why It Matters`,paragraphs:[`Nobody stays in the corridor. Everybody crosses it. Whoever was where, they were here first.`],bullets:[]}},source:`shared/data/locations/corridor.mdx`},{id:`dining`,name:`The Dining Car`,carriage:1,lede:`Eight tables, six of them laid, and a steward who remembers what everyone drinks without being told.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`White cloth, brass rail, and the window glass gone black by eight o'clock so the car dines looking at itself.`],bullets:[]},service:{heading:`Service`,paragraphs:[`The last order is taken at half past nine and the car is dark by ten. Anyone still seated after that was not eating.`],bullets:[]}},source:`shared/data/locations/dining.mdx`},{id:`guard_van`,name:`The Guard's Van`,carriage:0,lede:`Last car of the consist, and the only one with a door that opens onto nothing but weather.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Crates roped to the wall, a stove nobody has lit, and the guard's ledger open on a nail. The lamp swings wider here than anywhere forward, which is how you know you have reached the end of the train.`],bullets:[]},what_is_kept_here:{heading:`What Is Kept Here`,paragraphs:[`Everything nobody wanted in their berth. The ledger records what was loaded at Paris and what was loaded at Calais, and the two hands do not match.`],bullets:[]}},source:`shared/data/locations/guard_van.mdx`},{id:`platform`,name:`The Platform`,lede:`Not aboard at all. Where the passengers were before they were passengers, and the only place the enquiry cannot follow them.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Gas lamps at intervals, a clock two minutes fast, and porters who have already gone home.`],bullets:[]},why_it_matters:{heading:`Why It Matters`,paragraphs:[`Everyone boarded somewhere. What they were carrying when they did is a question the manifest answers and the passengers do not.`],bullets:[]}},source:`shared/data/locations/platform.mdx`},{id:`vestibule`,name:`The Vestibule`,carriage:4,lede:`The joint between cars, where the floor moves under you and conversation is impossible.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Concertina walls, a handrail worn bright, and a door to the trackside that is supposed to be locked while the train is moving.`],bullets:[]},why_it_matters:{heading:`Why It Matters`,paragraphs:[`The loudest six feet on the train, which makes it the only place aboard where two people can speak and be certain of not being overheard.`],bullets:[]}},source:`shared/data/locations/vestibule.mdx`}],articles:[{id:`aisle_midnight`,when:{level:`Aisle`,after:`23:00`,before:`03:00`},priority:10,kicker:`Stop Press`,title:`Lamps Found Extinguished End to End`,caption:`The aisle after midnight, lamps cold.`,lede:`The conductor, with a face of confusion, insisted the lamps were trimmed at eight.`,body:[`Yet no passenger admits to having passed that way since, and the corridor now lies dark from vestibule to vestibule.`,`Our correspondent walked its length twice and met no one, which he notes is itself remarkable on a train carrying forty-one souls.`,`As the wind continued to howl, the conductor became increasingly agitated and emotional distraught.`,`Questions concerning the lamps are now met not with answers, but accusations, curses, and theories implicating nearly every demon aboard.`],sections:{},source:`shared/data/articles/aisle_midnight.mdx`},{id:`aisle_woman`,when:{level:`Aisle`},priority:0,kicker:`Aboard the Express`,title:`Mysterious Woman Seen Walking the Aisle`,caption:`The aisle of Car No. 7, looking forward.`,lede:`Railway employees report unusual activity shortly after midnight, and the steward is unable to account for a second setting laid at table nine.`,body:[`The steward maintains that the fourth chair was drawn out before the soup, and that no one sat in it.`,`> "I did not lay it," he told our correspondent. "But the chair was drawn out before the soup came, as though someone had already taken her seat."`,`A porter questioned afterward disputed the steward’s account, but became visibly uneasy when asked whether he had seen anyone in the aisle.`,`> "I saw somebody," he said. "That is not the same thing."`,`He would say no more.`,`Several passengers later reported seeing a woman walking alone toward the forward vestibule shortly after midnight. No description agrees beyond this: she wore dark clothing, moved without haste, and was not seen returning.`,`Passengers were thereafter asked to remain in their compartments until the border and to report any door found unlocked that ought not to have been.`],sections:{},source:`shared/data/articles/aisle_woman.mdx`},{id:`departure`,when:{boot:!0},priority:0,kicker:`Late Extra`,title:`The Continental Express Departs Under Cover of Rain`,caption:`The platform, moments before departure.`,lede:`The Continental Express departed through a hard evening rain, the platform heavy with the smell of wet timber, musky tobacco, coal smoke, and hot iron. Glisening, the lamps were already burning against the weather and the station nearly deserted by the time the last whistle sounded.`,body:[`Boarding was otherwise without incident, save for two small irregularities which railway officials have thus far been unable to explain: one berth appears to have been claimed by two passengers, while a trunk was found aboard which no porter remembers carrying. Our correspondent, travelling in Car No. 7, observed the guard make two complete examinations of the train after departure. On the second occasion he was heard asking a steward, in some irritation,`,`> "Then where is the other one?"`,`The steward gave no answer within our hearing.`,`At the last halt, the stationmaster declined to discuss the matter and ordered the platform cleared before the train resumed its journey. Railway officials continue their enquiries. Any passenger possessing knowledge of the disputed berth, the unidentified luggage, or the person to whom either may belong is requested to present themselves to the conductor before the border crossing.`,`Passengers boarded without incident, though the guard reports one berth claimed twice and a trunk no porter admits to carrying.`,`Our correspondent, travelling in Car No. 7, reports that the guard has twice walked the length of the train without satisfying himself as to the whereabouts of the missing party. The stationmaster at the last halt declined to comment.`,`Enquiries continue. Any passenger with knowledge of the affair is asked to present themselves at the conductor's office before the border crossing.`],sections:{},source:`shared/data/articles/departure.mdx`},{id:`orbit_circled`,when:{level:`Orbit`},priority:0,kicker:`From the Trackside`,title:`The Whole Carriage Circled by Our Photographer`,caption:`The carriage, circled at speed.`,lede:`A circuit of the carriage made from the trackside disclosed several particulars not apparent from within.`,body:[`One window stood unlatched. Beneath it, on the rain-darkened paintwork, our photographer found the distinct mark of a hand. Farther along, a lamp still burned behind the curtain of a berth whose occupant insisted it had been extinguished before midnight.`,`A full turn about the coach reveals a window unlatched from within and a lamp still burning in a berth its occupant swears was dark.`,`From the trackside the coach gives up what its corridors hide: one window unlatched, and the mark of a hand below it on the paintwork.`,`The railway declines to say whether the train was stopped between halts. Our photographer, who was standing beside it, says it was.`],sections:{},source:`shared/data/articles/orbit_circled.mdx`},{id:`side_cutaway`,when:{level:`Side`},priority:0,kicker:`Cutaway Edition`,title:`Near Wall Removed: The Compartments Laid Bare`,caption:`Car No. 7 in section, near wall removed.`,lede:`With the trackside wall cut away, every compartment can be read at once. Our readers are invited to draw their own conclusions.`,body:[`Presented in section, the coach reads as a row of small rooms, each with its own account of the night, and no two accounts agreeing.`,`The Gazette offers no verdict. It offers the plan of the carriage, the hour of each movement, and the names of those aboard.`],sections:{},source:`shared/data/articles/side_cutaway.mdx`}],passengers:[{id:`beaumont`,name:`Lady Beaumont`,listed:`Lady Beaumont`,role:`Widow of the late Sir Rupert Beaumont`,berth:`Car No. 7, berth 1`,boarded:{at:`18:15`,where:`Calais`},location:`cabin`,suspect:!0,traits:[`imperious`,`travels without a maid`,`answers a question with a question`],relationships:[{who:`weiss`,tie:`Denies knowing him; addressed him by name at the barrier.`},{who:`carrow`,tie:`Interviewed her for a position in the spring, and did not offer it.`}],timeline:[{at:`18:15`,where:`platform`,note:`Boards early, ahead of the general call.`},{at:`20:30`,where:`corridor`,note:`Passes berth 4 twice, though her own is at the far end.`},{at:`23:40`,where:`cabin`,note:`Door heard to close. Lamp still burning at one.`}],lede:`Travelling without a maid, which the conductor notes and does not explain.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Mourning black of a cut three seasons old, worn as though it were this year's. A jet brooch at the throat, and gloves she does not remove, not for dinner and not for the customs officer.`],bullets:[]},alibi:{heading:`Alibi`,paragraphs:[`She says she did not leave her compartment after the dinner service, and that she heard nothing until the guard began knocking on doors.`],bullets:[`Says she retired at nine`,`Says the corridor was lit when she last saw it`,`Says she has never met Dr. Weiss`]},what_the_guard_says:{heading:`What the Guard Says`,paragraphs:[`Her trunk was carried aboard by no porter anyone can name, and it went into the van without a label. He is certain of both things and will say neither in front of her.`],bullets:[]},under_enquiry:{heading:`Under Enquiry`,paragraphs:[`The brooch is jet, which is mourning wear. The ring beneath the left glove is not, and she has worn it since Calais.`],bullets:[]}},source:`shared/data/passengers/beaumont.mdx`},{id:`carrow`,name:`Amelia Carrow`,listed:`Miss A. Carrow`,role:`Lady's companion, between positions`,berth:`Car No. 7, berth 6`,boarded:{at:`18:48`,where:`Calais`},location:`cabin`,suspect:!1,traits:[`a light sleeper by trade`,`will not name her employer`,`notices what she is not meant to`],relationships:[{who:`beaumont`,tie:`Was interviewed by her in the spring, and not engaged.`}],timeline:[{at:`18:48`,where:`platform`,note:`Boards alone, with a case borrowed from someone taller.`},{at:`21:45`,where:`corridor`,note:`Fetches water, and passes berth 1 on the way back.`},{at:`01:00`,where:`cabin`,note:`Awake, and certain of the hour.`}],lede:`A companion by profession, returning to an employer she will not name.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Neat, plain, and dressed to be looked past, which she has made a professional skill.`],bullets:[]},alibi:{heading:`Alibi`,paragraphs:[`She was in her compartment and awake, and she is the only passenger who does not claim to have slept through anything.`],bullets:[`Says she heard a door in the small hours`,`Says it was not her own`,`Says she did not look`]},what_she_heard:{heading:`What She Heard`,paragraphs:[`A door, then a pause too long for someone passing through, then the same door again. She places it at one, and she is a light sleeper by trade.`],bullets:[]},under_enquiry:{heading:`Under Enquiry`,paragraphs:[`She will not name her employer, and the position she is returning to was filled in June.`],bullets:[]}},source:`shared/data/passengers/carrow.mdx`},{id:`dupont`,name:`Marcel Dupont`,listed:`M. Dupont`,role:`Commercial traveller, aboard since Paris`,berth:`Car No. 7, berth 8`,boarded:{at:`16:05`,where:`Paris`},location:`dining`,suspect:!1,traits:[`known to the guard by name`,`keeps an appointment book`,`pays for his own wine`],relationships:[{who:`thompson`,tie:`Shared a table by chance, and talked business neither seems to conduct.`}],timeline:[{at:`16:05`,where:`platform`,note:`Boards at Paris, first of the through passengers.`},{at:`20:00`,where:`dining`,note:`Dines alone, at the same table he always takes.`},{at:`20:30`,where:`dining`,note:`Waits for an appointment nobody sees him keep.`}],lede:`The only passenger aboard since Paris, and the only one the guard greets by name.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Travelling clothes worn comfortable, a sample case he never opens, and the calm of a man who has made this run forty times.`],bullets:[]},alibi:{heading:`Alibi`,paragraphs:[`He was in the dining car until the service closed, which the steward confirms without being asked, and which is the trouble with it.`],bullets:[`Says he dined at eight, as always`,`Says he waited for a colleague who did not come`,`Says he noticed nothing unusual`]},the_appointment_book:{heading:`The Appointment Book`,paragraphs:[`Tonight's page carries a single entry at half past eight, in a hand that is not his, and the page before it has been removed.`],bullets:[]},under_enquiry:{heading:`Under Enquiry`,paragraphs:[`He is the only passenger with no reason to be nervous, and he is nervous.`],bullets:[]}},source:`shared/data/passengers/dupont.mdx`},{id:`thompson`,name:`Edward Thompson`,listed:`Mr. E. Thompson`,role:`Grain factor, of Norwich`,berth:`Car No. 7, berth 3`,boarded:{at:`18:40`,where:`Calais`},location:`dining`,suspect:!1,traits:[`describes his business twice and differently`,`dines early and alone`,`asks about the timetable`],relationships:[{who:`dupont`,tie:`Shared a table by chance, or says it was chance.`}],timeline:[{at:`18:40`,where:`platform`,note:`Boards with one case and no trunk.`},{at:`19:30`,where:`dining`,note:`Dines before the service properly opens.`},{at:`22:00`,where:`cabin`,note:`Retires early and is not seen again before the alarm.`}],lede:`A grain factor from Norwich, travelling on business he describes twice and differently.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`A good coat kept too long, boots newly resoled, and a case with a lock that has been forced and repaired.`],bullets:[]},alibi:{heading:`Alibi`,paragraphs:[`He dined early, retired early, and slept through it, which is what a man says when he has nothing to hide and also when he has.`],bullets:[`Says he was asleep by ten`,`Says he heard the guard and nothing before it`,`Says he has never travelled this line before`]},the_question_he_asked:{heading:`The Question He Asked`,paragraphs:[`He asked the steward whether the train stops between halts. Told that it does not, he said nothing further, and did not look surprised.`],bullets:[]},under_enquiry:{heading:`Under Enquiry`,paragraphs:[`The lock on his case was forced from the inside.`],bullets:[]}},source:`shared/data/passengers/thompson.mdx`},{id:`weiss`,name:`Doctor Heinrich Weiss`,listed:`Dr. H. Weiss`,role:`Physician, of Vienna`,berth:`Car No. 7, berth 5`,boarded:{at:`18:52`,where:`Calais`},location:`corridor`,suspect:!0,traits:[`offers help before it is asked for`,`watches the corridor, not the window`,`carries his case everywhere`],relationships:[{who:`beaumont`,tie:`Greeted her at the barrier; now says they have never met.`},{who:`thompson`,tie:`Dined at the next table and left when Thompson did.`}],timeline:[{at:`18:52`,where:`platform`,note:`Boards last, after the general call.`},{at:`21:10`,where:`dining`,note:`Takes coffee he does not drink.`},{at:`00:20`,where:`corridor`,note:`Found at the far end, in the dark, fully dressed.`}],lede:`A physician, he says, of Vienna, though his case holds instruments no physician carries.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Grey at the temples, spectacles he cleans when asked a direct question, and a coat too heavy for a heated carriage.`],bullets:[]},alibi:{heading:`Alibi`,paragraphs:[`He was walking the corridor because he could not sleep, and he offered his help because he is a doctor and that is what a doctor does.`],bullets:[`Says he slept badly and rose after midnight`,`Says he saw no one in the corridor`,`Says the lamps were already out when he passed`]},the_case:{heading:`The Case`,paragraphs:[`Brass fittings, Viennese maker's mark, and a tray of instruments too fine for surgery and too sharp for anything else. He does not let a porter carry it.`],bullets:[]},under_enquiry:{heading:`Under Enquiry`,paragraphs:[`He asked whether help was wanted before anyone aboard had said that anything was wrong.`],bullets:[]}},source:`shared/data/passengers/weiss.mdx`}],items:[{id:`brass_key`,name:`Brass Key`,kind:`key`,carried:!0,reveals:[`the_number_belongs_to_another_carriage`],lede:`Small, worn bright at the bow, and stamped with a numbe
